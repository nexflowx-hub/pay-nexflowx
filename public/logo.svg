<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xml:space="preserve">
  <defs>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="lock-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2f1"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="1" y="1" width="30" height="30" rx="8" ry="8" fill="url(#shield-grad)"/>

  <!-- Lock shackle (top arc) -->
  <path d="M11 14.5V11.5C11 9.29 12.79 7.5 15 7.5C17.21 7.5 19 9.29 19 11.5V14.5"
        fill="none" stroke="url(#lock-grad)" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Lock body -->
  <rect x="9.5" y="14.5" width="11" height="9" rx="2" ry="2" fill="url(#lock-grad)"/>

  <!-- Keyhole -->
  <circle cx="15" cy="17.8" r="1.5" fill="#0d9488"/>
  <rect x="14.4" y="17.8" width="1.2" height="2.8" rx="0.4" fill="#0d9488"/>
</svg>
